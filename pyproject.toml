[project]
name = "commit-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
